<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Shalini Tuition Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Login -->
  <main id="loginView" class="login-wrap">
    <form id="loginForm" class="login-card">
      <h1 class="brand">Shalini Tuition Center</h1>
      <p class="muted">Admin login</p>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <p id="loginError" class="error" role="alert"></p>
      <button type="submit" class="btn primary" id="loginBtn">Log in</button>
    </form>
  </main>

  <!-- Dashboard -->
  <div id="appView" hidden>
    <header class="topbar">
      <h1 class="brand">Shalini Tuition Center</h1>
      <button class="btn light" id="logoutBtn">Log out</button>
    </header>

    <main class="container">
      <section class="cards" aria-label="Summary">
        <div class="card"><span class="card-num" id="totalCount">0</span><span>Total students</span></div>
        <div class="card paid"><span class="card-num" id="paidCount">0</span><span>Paid</span></div>
        <div class="card unpaid"><span class="card-num" id="unpaidCount">0</span><span>Not paid</span></div>
      </section>

      <section class="toolbar">
        <input type="search" id="search" placeholder="Search by student name" aria-label="Search by student name">
        <select id="classFilter" aria-label="Filter by class"></select>
        <select id="statusFilter" aria-label="Filter by payment status">
          <option value="">All payments</option>
          <option value="PAID">PAID</option>
          <option value="NOT PAID">NOT PAID</option>
        </select>
        <button class="btn primary" id="addBtn">Add student</button>
        <button class="btn outline" id="exportBtn">Export CSV</button>
      </section>

      <p id="message" class="message" role="status"></p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Student Name</th><th>Student Class</th><th>Payment Status</th><th>Actions</th></tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
        <p id="emptyMsg" class="empty" hidden>No students found.</p>
      </div>
    </main>
  </div>

  <!-- Add / Edit dialog -->
  <dialog id="studentDialog">
    <form id="studentForm" method="dialog">
      <h2 id="dialogTitle">Add student</h2>
      <label for="nameInput">Student name</label>
      <input type="text" id="nameInput" maxlength="60" required>
      <label for="classInput">Student class</label>
      <select id="classInput" required></select>
      <label for="statusInput">Payment status</label>
      <select id="statusInput" required>
        <option value="NOT PAID">NOT PAID</option>
        <option value="PAID">PAID</option>
      </select>
      <p id="formError" class="error" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" class="btn outline" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn primary" id="saveBtn">Save student</button>
      </div>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
